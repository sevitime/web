<style>
  .noticias { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  .noticias h1 {
    font-size: var(--t-titulo); font-weight: 800; color: var(--texto);
    letter-spacing: -0.02em; margin: 0 0 4px;
  }
  .noticias .intro { margin: 0 0 18px; font-size: var(--t-cuerpo); color: var(--apagado); text-wrap: pretty; }
  .n-estado { margin: 0 0 16px; font-size: var(--t-cuerpo); color: var(--apagado); }
  .n-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .n-item {
    border: 1px solid var(--borde); border-radius: var(--r-lg);
    background: var(--superficie); overflow: hidden;
  }
  .n-enlace { display: flex; gap: 0; text-decoration: none; color: inherit; }
  .n-foto {
    flex: 0 0 104px; width: 104px; height: 104px; object-fit: cover;
    background: var(--gris-bg);
  }
  .n-cuerpo { min-width: 0; flex: 1 1 auto; padding: 12px 14px; }
  .n-titulo { margin: 0; font-size: var(--t-item); font-weight: 700; color: var(--texto); }
  .n-extracto {
    margin: 5px 0 0; font-size: var(--t-cuerpo); color: var(--apagado);
    text-wrap: pretty;
  }
  .n-meta { display: block; margin-top: 7px; font-size: var(--t-etiqueta); color: var(--tenue); }
  @media (hover: hover) and (pointer: fine) {
    .n-item:hover { border-color: var(--verde-claro); }
  }
  .n-enlace:focus-visible { outline: 3px solid var(--verde-claro); outline-offset: -3px; }
  .n-pie { margin: 24px 0 0; font-size: var(--t-etiqueta); color: var(--tenue); text-wrap: pretty; }

  /* «Ver más»: el mismo botón que la lista de Explorar. */
  .btn-mas {
    display: block; width: 100%; min-height: 48px; margin-top: 16px;
    border: 1px solid var(--borde); border-radius: var(--r-pill);
    background: var(--superficie); color: var(--texto);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn-mas:hover { border-color: var(--verde-claro); }
  .btn-mas:focus-visible { outline: 3px solid var(--verde-claro); outline-offset: 2px; }

  /* Obligatorio, no decorativo: `.btn-mas` trae su propio `display`, y una
     regla de autor gana al `[hidden] { display: none }` del navegador. Sin
     esto el atributo `hidden` no oculta nada y el botón se queda a la vista
     con la lista ya completa. Es el mismo tropiezo que hubo en
     `explorar/index.html` y en `lugar/index.html`. */
  [hidden] { display: none !important; }
</style>
