<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión — SeviTime</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1C1A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F7F6" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Los estilos van aquí dentro y no en `estilo.css`: esta página es
     justamente la que se ve cuando no hay red, y no puede depender de que
     otro fichero haya llegado. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { color-scheme: dark light; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px calc(24px + env(safe-area-inset-left, 0px));
    background: #0F1C1A;
    color: #E8F0EF;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
    line-height: 1.5;
  }
  main { max-width: 32rem; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 20px 0 10px; font-size: 1.35rem; font-weight: 700; }
  p { color: #8AADAA; font-size: 1rem; }
  p + p { margin-top: 10px; }
  a.boton {
    display: inline-block;
    margin-top: 22px;
    padding: 12px 22px;
    border-radius: 999px;
    background: #00796B;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
  }
  @media (prefers-color-scheme: light) {
    body { background: #F2F7F6; color: #1A2E2B; }
    p { color: #4A6360; }
  }
</style>
</head>
<body>
<main>
  <img src="/favicon-192.png" width="72" height="72" alt="SeviTime">
  <h1>Sin conexión</h1>
  <p>SeviTime necesita internet para saber qué tienes cerca, qué pasa hoy y qué dice la gente.</p>
  <p>Vuelve a intentarlo en cuanto tengas cobertura.</p>
  <a class="boton" href="/explorar/">Reintentar</a>
</main>
</body>
</html>
