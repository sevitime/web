<style>
  /* Rutas: la lista a la izquierda y el mapa a la derecha, como Explorar.
     Aquí el mapa no enseña todos los sitios, sino el itinerario elegido. */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .top-nav { flex: 0 0 auto; }
  .rutas { flex: 1; min-height: 0; display: flex; }

  .panel-lateral {
    flex: 0 0 420px; width: 420px;
    display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--borde);
    background: var(--fondo);
  }
  .intro { padding: 16px 16px 4px; }
  .intro h1 { margin: 0; font-size: var(--t-titulo); color: var(--texto); }
  .intro p { margin: 6px 0 0; font-size: var(--t-cuerpo); color: var(--apagado); }
  .btn-crear {
    display: inline-block; margin-top: 10px; padding: 8px 14px;
    background: var(--verde); color: #fff; border-radius: var(--r-sm);
    font-size: var(--t-cuerpo); font-weight: 600; text-decoration: none;
  }
  .btn-crear:hover { filter: brightness(1.08); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 6px; }
  .chip {
    border: 1.5px solid var(--borde); background: var(--superficie); color: var(--apagado);
    font-family: inherit; font-size: var(--t-etiqueta);
    padding: 6px 11px; border-radius: var(--r-pill); cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--verde-claro); }
  .chip.seleccionado { background: var(--verde); border-color: var(--verde); color: #fff; font-weight: 600; }

  .resumen { padding: 0 16px 8px; font-size: var(--t-etiqueta); color: var(--tenue); }

  .lista { list-style: none; margin: 0; flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 16px; }
  .ruta {
    border: 1px solid var(--borde); border-radius: var(--r-lg);
    margin: 8px; background: var(--superficie); overflow: hidden;
  }
  .ruta-cab {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    padding: 12px; border: none; background: transparent; cursor: pointer; font-family: inherit;
    color: var(--texto);
  }
  .ruta-cab:hover { background: var(--superficie-alta); }
  .ruta-cab:focus-visible { outline: 2px solid var(--verde-claro); outline-offset: -2px; }
  .ruta.activa { border-color: var(--verde); box-shadow: 0 0 0 1px var(--verde); }
  .ruta-ico {
    width: 40px; height: 40px; flex: 0 0 auto; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    background: var(--superficie-alta);
  }
  .ruta-texto { min-width: 0; flex: 1; }
  .ruta-nombre { display: block; font-size: var(--t-item); font-weight: 700; color: var(--texto); }
  .ruta-desc { display: block; font-size: var(--t-cuerpo); color: var(--apagado); margin-top: 2px; }
  .ruta-meta {
    display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 8px;
    font-size: var(--t-etiqueta); color: var(--tenue);
  }
  .ruta-meta b { color: var(--verde-claro); font-weight: 700; }
  .sello {
    display: inline-block; padding: 1px 8px; border-radius: var(--r-pill);
    background: var(--gris-bg); color: var(--gris-fg); font-size: var(--t-etiqueta); font-weight: 600;
  }
  .sello.rec { background: var(--ok-bg); color: var(--ok-fg); }

  .paradas { border-top: 1px solid var(--borde); }
  .parada {
    display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
    padding: 10px 12px; border: none; border-bottom: 1px solid var(--borde);
    background: transparent; cursor: pointer; font-family: inherit; color: var(--texto);
  }
  .parada:last-child { border-bottom: none; }
  .parada:hover { background: var(--superficie-alta); }
  .parada:focus-visible { outline: 2px solid var(--verde-claro); outline-offset: -2px; }
  .parada-num {
    width: 22px; height: 22px; flex: 0 0 auto; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--t-etiqueta); font-weight: 700; color: #fff;
  }
  .parada-texto { min-width: 0; }
  .parada-nombre { display: block; font-size: var(--t-cuerpo); font-weight: 600; }
  .parada-meta { display: block; font-size: var(--t-etiqueta); color: var(--tenue); margin-top: 1px; }
  .parada-nota { display: block; font-size: var(--t-cuerpo); color: var(--apagado); margin-top: 4px; font-style: italic; }

  .mapa-caja { flex: 1; min-width: 0; position: relative; }
  #map { position: absolute; inset: 0; }
  .mapa-resumen {
    position: absolute; z-index: 2; top: 14px; left: 14px;
    max-width: calc(100% - 74px); padding: 8px 12px;
    border: 1px solid var(--borde); border-radius: var(--r-pill);
    background: color-mix(in srgb, var(--superficie) 92%, transparent);
    color: var(--texto); box-shadow: 0 3px 14px rgba(15, 28, 26, .14);
    font-size: var(--t-etiqueta); font-weight: 600; pointer-events: none;
    backdrop-filter: blur(8px);
  }

  .maplibregl-popup-content { background: var(--superficie) !important; border: 1px solid var(--borde); border-radius: var(--r-sm); }
  .maplibregl-popup-tip { border-top-color: var(--superficie) !important; border-bottom-color: var(--superficie) !important; }
  .popup { font-family: 'Inter', sans-serif; }
  .popup .nombre { font-size: var(--t-item); font-weight: 700; color: var(--texto); }
  .popup .meta { font-size: var(--t-etiqueta); color: var(--apagado); margin-top: 2px; }
  .popup a { display: inline-block; margin-top: 8px; font-size: var(--t-etiqueta); color: var(--verde-claro); text-decoration: none; }
  .popup a:hover { text-decoration: underline; }
  .popup .nota { font-size: var(--t-cuerpo); color: var(--texto); margin-top: 6px; font-style: italic; }

  @media (max-width: 899px) {
    body { display: block; }
    .rutas { flex-direction: column; height: auto; }
    .mapa-caja { order: -1; flex: none; height: 48dvh; position: sticky; top: 0; z-index: 3; }
    .panel-lateral { flex: none; width: auto; border-right: none; border-top: 1px solid var(--borde); }
    .lista { overflow: visible; }
  }
</style>
</head>

<main class="rutas">
  <aside class="panel-lateral">
